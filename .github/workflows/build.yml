name: build-wie-jni
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Write sources
        run: |
          rm -rf wie_jni
          mkdir -p $(dirname wie_jni/Cargo.toml)
          cat > wie_jni/Cargo.toml <<'WIE_EOF'
          [package]
          name = "wie_jni"
          version = "0.2.0"
          edition = "2024"
          license = "MIT"
          description = "JNI glue that lets the existing net.wie.app.WieActivity shell run on upstream wie"
          publish = false

          [lib]
          crate-type = ["cdylib", "rlib"]

          [features]
          # The JIT backend needs a newer rustc than some hosts have; turning it off keeps
          # the crate buildable there (the emulator then falls back to the interpreter).
          default = ["jit"]
          jit = ["dep:wie-core-arm-native"]

          [dependencies]
          anyhow = "1"
          async-trait = "0.1"
          jni = { version = "0.21", default-features = false }
          tracing = "0.1"
          tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

          wie = { path = "../wie", default-features = false }
          wie-backend = { path = "../wie/wie-backend" }
          wie-core-arm-native = { path = "../wie/wie-core-arm-native", optional = true }
          wie-util = { path = "../wie/wie-util" }

          [dev-dependencies]
          png = "0.17"

          [profile.release]
          lto = true
          codegen-units = 1
          opt-level = 3
          panic = "unwind"
          WIE_EOF
          mkdir -p $(dirname wie_jni/src/lib.rs)
          cat > wie_jni/src/lib.rs <<'WIE_EOF'
          //! `libwie_jni.so` for the `net.wie.app` Android shell, built on upstream wie.
          //!
          //! The Java side (WieActivity/GameView/PadCfg) is unchanged; this crate only has to
          //! honour the contract it expects from `net.wie.app.WieNative`:
          //!
          //! * `nativeInit(zip, filesDir) -> int` — 0 on success, otherwise see `nativeLastError`.
          //! * `nativeTick()` — called ~60 times per second on the game thread, followed by
          //!   draining `nativePollOut()` until it returns null.
          //! * `nativeKey(code, down)` — 1..4 = UP DOWN LEFT RIGHT, 5 OK, 6 LSK, 7 RSK, 8 CLEAR,
          //!   9 CALL, 10..19 = NUM0..NUM9, 20 STAR, 21 HASH, 22 HANGUP.
          //! * `nativePollOut() -> byte[]` — first byte is a tag:
          //!   0 = play SFX (rest: SMAF bytes), 1 = play BGM loop (rest: SMAF bytes),
          //!   2 = stop (`[2, 1]` BGM, `[2, 0]` SFX), 3 = vibrate (u32 LE milliseconds),
          //!   4 = PCM (u32 LE sample rate, then i16 LE mono samples), 5 = volume (0..100).
          //! * `nativeSetSurface(Surface)` — target for frames; null when destroyed.
          //! * Saves live in `filesDir/wie_fs_v1` and `filesDir/wie_db_v1` (see `store`).

          pub mod aot_cache;
          pub mod overlay;
          pub mod store;
          pub mod window;

          use std::{
              cell::RefCell,
              collections::{HashMap, HashSet, VecDeque},
              panic::{AssertUnwindSafe, catch_unwind},
              path::Path,
              sync::{
                  Mutex,
                  atomic::{AtomicBool, AtomicU32, Ordering},
              },
              time::{Duration, Instant as StdInstant, SystemTime, UNIX_EPOCH},
          };

          use jni::{
              JNIEnv,
              objects::{JByteArray, JClass, JObject, JString},
              sys::{jboolean, jbyteArray, jint},
          };
          use wie_backend::{
              AudioCommand, AudioEventData, AudioHandle, Emulator, Event, Filesystem, Font, Instant, KeyCode, Options, Platform, Screen,
              canvas::Image,
          };

          use crate::{store::Store, window::Frame};

          const KEY_REPEAT: Duration = Duration::from_millis(100);
          /// How long one `nativeTick()` may keep the guest running. The Java shell aims for a
          /// 60Hz cadence (~16.6ms), so this leaves room for the shell's own per-frame work.
          const FRAME_BUDGET: Duration = Duration::from_millis(14);
          /// A work slice shorter than this means the executor had nothing runnable.
          const IDLE_SLICE: Duration = Duration::from_micros(300);

          /// `WIE_FRAME_BUDGET_MS` overrides the budget; 0 restores one slice per frame.
          fn frame_budget() -> Duration {
              static CACHED: Mutex<Option<Duration>> = Mutex::new(None);
              let mut cached = lock(&CACHED);
              *cached.get_or_insert_with(|| {
                  std::env::var("WIE_FRAME_BUDGET_MS")
                      .ok()
                      .and_then(|value| value.parse::<u64>().ok())
                      .map_or(FRAME_BUDGET, Duration::from_millis)
              })
          }

          static WIDTH: AtomicU32 = AtomicU32::new(240);
          static HEIGHT: AtomicU32 = AtomicU32::new(320);
          static OUT: Mutex<VecDeque<Vec<u8>>> = Mutex::new(VecDeque::new());
          static KEYS: Mutex<VecDeque<(KeyCode, bool)>> = Mutex::new(VecDeque::new());
          static LAST_ERROR: Mutex<String> = Mutex::new(String::new());
          static EXITED: AtomicBool = AtomicBool::new(false);

          fn lock<T>(mutex: &'static Mutex<T>) -> std::sync::MutexGuard<'static, T> {
              mutex.lock().unwrap_or_else(|poison| poison.into_inner())
          }

          fn push_out(message: Vec<u8>) {
              let mut out = lock(&OUT);
              // Never let an unread queue grow without bound (e.g. while paused).
              if out.len() > 512 {
                  out.pop_front();
              }
              out.push_back(message);
          }

          fn set_error(message: impl Into<String>) {
              let message = message.into();
              tracing::error!("{message}");
              *lock(&LAST_ERROR) = message;
          }

          // ---------------------------------------------------------------- platform

          struct JniScreen;

          impl Screen for JniScreen {
              fn resize(&self, width: u32, height: u32) -> wie_util::Result<()> {
                  WIDTH.store(width, Ordering::Relaxed);
                  HEIGHT.store(height, Ordering::Relaxed);
                  Ok(())
              }

              fn request_redraw(&self) -> wie_util::Result<()> {
                  REDRAW.store(true, Ordering::Relaxed);
                  Ok(())
              }

              fn paint(&self, image: &dyn Image) {
                  let (width, height) = (image.width(), image.height());
                  let mut rgba = Vec::with_capacity((width * height * 4) as usize);
                  for color in image.colors() {
                      rgba.extend_from_slice(&[color.r, color.g, color.b, 0xff]);
                  }
                  rgba.resize((width * height * 4) as usize, 0);
                  overlay::note_frame();
                  overlay::draw(&mut rgba, width, height, &overlay::status_line());
                  window::present(Frame { width, height, rgba });
              }

              fn width(&self) -> u32 {
                  WIDTH.load(Ordering::Relaxed)
              }

              fn height(&self) -> u32 {
                  HEIGHT.load(Ordering::Relaxed)
              }
          }

          static BGM_HANDLES: Mutex<Option<HashSet<AudioHandle>>> = Mutex::new(None);

          struct JniAudioSink;

          impl wie_backend::AudioSink for JniAudioSink {
              fn send(&self, command: AudioCommand) {
                  match command {
                      AudioCommand::Play { handle, sequence, repeat } => {
                          {
                              let mut bgm = lock(&BGM_HANDLES);
                              let bgm = bgm.get_or_insert_with(HashSet::new);
                              if repeat {
                                  bgm.insert(handle);
                              } else {
                                  bgm.remove(&handle);
                              }
                          }

                          if let Some(source) = &sequence.source {
                              let mut message = Vec::with_capacity(source.len() + 1);
                              message.push(if repeat { 1 } else { 0 });
                              message.extend_from_slice(source);
                              push_out(message);
                              return;
                          }

                          // No SMAF source: forward any raw PCM the sequence carries.
                          for event in &sequence.events {
                              if let AudioEventData::Wave {
                                  channels,
                                  sampling_rate,
                                  samples,
                              } = &event.data
                              {
                                  let channels = (*channels).max(1) as usize;
                                  let mut message = Vec::with_capacity(5 + samples.len() / channels * 2);
                                  message.push(4);
                                  message.extend_from_slice(&sampling_rate.to_le_bytes());
                                  for frame in samples.chunks(channels) {
                                      let mixed = frame.iter().map(|&s| s as i32).sum::<i32>() / frame.len() as i32;
                                      message.extend_from_slice(&(mixed as i16).to_le_bytes());
                                  }
                                  push_out(message);
                              }
                          }
                      }
                      AudioCommand::Stop { handle } => {
                          let is_bgm = lock(&BGM_HANDLES).as_ref().is_some_and(|bgm| bgm.contains(&handle));
                          push_out(vec![2, if is_bgm { 1 } else { 0 }]);
                      }
                  }
              }
          }

          struct JniPlatform {
              font: Font,
              screen: JniScreen,
              store: Store,
          }

          impl Platform for JniPlatform {
              fn font(&self) -> &Font {
                  &self.font
              }

              fn screen(&self) -> &dyn Screen {
                  &self.screen
              }

              fn now(&self) -> Instant {
                  let millis = SystemTime::now().duration_since(UNIX_EPOCH).unwrap_or_default().as_millis();
                  Instant::from_epoch_millis(millis as _)
              }

              fn database_repository(&self) -> &dyn wie_backend::DatabaseRepository {
                  &self.store
              }

              fn filesystem(&self) -> &dyn Filesystem {
                  &self.store
              }

              fn audio_sink(&self) -> Box<dyn wie_backend::AudioSink> {
                  Box::new(JniAudioSink)
              }

              fn write_stdout(&self, buf: &[u8]) {
                  tracing::info!("[app] {}", String::from_utf8_lossy(buf).trim_end());
              }

              fn write_stderr(&self, buf: &[u8]) {
                  tracing::warn!("[app] {}", String::from_utf8_lossy(buf).trim_end());
              }

              fn exit(&self) {
                  tracing::info!("[app] exit requested");
                  EXITED.store(true, Ordering::Relaxed);
              }

              fn vibrate(&self, duration_ms: u64, _intensity: u8) {
                  let mut message = vec![3];
                  message.extend_from_slice(&(duration_ms.min(u32::MAX as u64) as u32).to_le_bytes());
                  push_out(message);
              }
          }

          // ---------------------------------------------------------------- runtime

          struct Runtime {
              emulator: Box<dyn Emulator>,
              store: Store,
              ready: bool,
              failed: bool,
              held: HashMap<KeyCode, StdInstant>,
          }

          thread_local! {
              // nativeInit and nativeTick both run on the game thread.
              static RUNTIME: RefCell<Option<Runtime>> = const { RefCell::new(None) };
          }

          static REDRAW: AtomicBool = AtomicBool::new(false);

          fn key_from_code(code: i32) -> Option<KeyCode> {
              Some(match code {
                  1 => KeyCode::UP,
                  2 => KeyCode::DOWN,
                  3 => KeyCode::LEFT,
                  4 => KeyCode::RIGHT,
                  5 => KeyCode::OK,
                  6 => KeyCode::LEFT_SOFT_KEY,
                  7 => KeyCode::RIGHT_SOFT_KEY,
                  8 => KeyCode::CLEAR,
                  9 => KeyCode::CALL,
                  10 => KeyCode::NUM0,
                  11 => KeyCode::NUM1,
                  12 => KeyCode::NUM2,
                  13 => KeyCode::NUM3,
                  14 => KeyCode::NUM4,
                  15 => KeyCode::NUM5,
                  16 => KeyCode::NUM6,
                  17 => KeyCode::NUM7,
                  18 => KeyCode::NUM8,
                  19 => KeyCode::NUM9,
                  20 => KeyCode::STAR,
                  21 => KeyCode::HASH,
                  22 => KeyCode::HANGUP,
                  _ => return None,
              })
          }

          /// Starts the game in `zip` (a KTF/LGT/SKT archive), persisting saves under `data_dir`.
          pub fn init(zip: Vec<u8>, data_dir: &Path) -> anyhow::Result<()> {
              logging::init();
              lock(&OUT).clear();
              lock(&KEYS).clear();
              EXITED.store(false, Ordering::Relaxed);

              let store = Store::open(data_dir);
              let platform = Box::new(JniPlatform {
                  font: Font::try_from_static(include_bytes!("../../wie/assets/neodgm.ttf"))?,
                  screen: JniScreen,
                  store: store.clone(),
              });

              // Without a CompiledExecutor, wie falls back to stepping the ARM interpreter one
              // instruction at a time, which is far too slow for this phone's ARMv8 core. The
              // official wie-app frontend instead JIT-compiles hot code via wie-core-arm-native;
              // we do the same, with compiled regions cached to disk so repeat launches skip
              // recompilation.
              #[cfg(feature = "jit")]
              let aot = {
                  let cache = Box::new(aot_cache::FileCache::new(data_dir.join("aot_cache")));
                  Some(Box::new(wie_core_arm_native::NativeExecutor::new(Some(cache))) as Box<_>)
              };
              #[cfg(not(feature = "jit"))]
              let aot = None;

              let options = Options {
                  enable_gdbserver: false,
                  aot,
                  profile: None,
              };
              let emulator = wie::load_emulator("game.zip", zip, platform, options)?;
              tracing::info!("[init] emulator created, screen {}x{}", WIDTH.load(Ordering::Relaxed), HEIGHT.load(Ordering::Relaxed));

              RUNTIME.with_borrow_mut(|runtime| {
                  *runtime = Some(Runtime {
                      emulator,
                      store,
                      ready: false,
                      failed: false,
                      held: HashMap::new(),
                  })
              });
              Ok(())
          }

          /// Advances the emulator by one frame. Returns false once it has stopped.
          pub fn tick() -> bool {
              RUNTIME.with_borrow_mut(|runtime| {
                  let Some(runtime) = runtime.as_mut() else { return false };
                  if runtime.failed || EXITED.load(Ordering::Relaxed) {
                      runtime.store.flush(true);
                      return false;
                  }

                  let now = StdInstant::now();
                  let keys: Vec<(KeyCode, bool)> = lock(&KEYS).drain(..).collect();
                  for (key, down) in keys {
                      if down {
                          if runtime.ready && !runtime.held.contains_key(&key) {
                              runtime.emulator.handle_event(Event::Keydown(key));
                              runtime.held.insert(key, now);
                          }
                      } else if runtime.held.remove(&key).is_some() {
                          runtime.emulator.handle_event(Event::Keyup(key));
                      }
                  }
                  for (key, since) in runtime.held.iter_mut() {
                      if now.duration_since(*since) > KEY_REPEAT {
                          runtime.emulator.handle_event(Event::Keyrepeat(*key));
                          *since = now;
                      }
                  }

                  if REDRAW.swap(false, Ordering::Relaxed) {
                      runtime.emulator.handle_event(Event::Redraw);
                  }

                  // `Emulator::tick` is one work slice, not one frame: wie's executor runs for at
                  // most 8ms and returns. The upstream frontend calls it back-to-back (1ms poll),
                  // so the guest gets essentially all of the wall clock. The Java shell here calls
                  // nativeTick() only once per 60Hz frame, which would hand the guest well under
                  // half of real time and run the game in slow motion. Keep slicing until the
                  // frame budget is spent, and stop early once the executor goes idle so a game
                  // that is merely waiting on a timer does not busy-burn the budget.
                  let deadline = now + frame_budget();
                  loop {
                      let slice_start = StdInstant::now();
                      if let Err(error) = runtime.emulator.tick() {
                          runtime.failed = true;
                          set_error(format!("emulator stopped: {error}"));
                          runtime.store.flush(true);
                          return false;
                      }
                      let idle = slice_start.elapsed() < IDLE_SLICE;
                      if idle || StdInstant::now() >= deadline {
                          break;
                      }
                  }

                  if !runtime.ready && !runtime.emulator.is_preparing() {
                      runtime.ready = true;
                      tracing::info!("[tick] emulator ready");
                  }

                  runtime.store.flush(false);
                  overlay::note_tick(now.elapsed());
                  true
              })
          }

          pub fn key(code: i32, down: bool) {
              if let Some(key) = key_from_code(code) {
                  lock(&KEYS).push_back((key, down));
              }
          }

          pub fn poll_out() -> Option<Vec<u8>> {
              lock(&OUT).pop_front()
          }

          pub fn last_error() -> String {
              lock(&LAST_ERROR).clone()
          }

          pub fn screen_size() -> (u32, u32) {
              (WIDTH.load(Ordering::Relaxed), HEIGHT.load(Ordering::Relaxed))
          }

          fn guarded<R>(fallback: R, f: impl FnOnce() -> R) -> R {
              match catch_unwind(AssertUnwindSafe(f)) {
                  Ok(value) => value,
                  Err(panic) => {
                      let message = panic
                          .downcast_ref::<&str>()
                          .map(|s| s.to_string())
                          .or_else(|| panic.downcast_ref::<String>().cloned())
                          .unwrap_or_else(|| "unknown panic".into());
                      set_error(format!("panic: {message}"));
                      RUNTIME.with_borrow_mut(|runtime| {
                          if let Some(runtime) = runtime.as_mut() {
                              runtime.failed = true;
                          }
                      });
                      fallback
                  }
              }
          }

          // ---------------------------------------------------------------- JNI

          fn byte_array(env: &mut JNIEnv<'_>, bytes: Option<Vec<u8>>) -> jbyteArray {
              match bytes {
                  Some(bytes) => env
                      .byte_array_from_slice(&bytes)
                      .map(JByteArray::into_raw)
                      .unwrap_or(std::ptr::null_mut()),
                  None => std::ptr::null_mut(),
              }
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_net_wie_app_WieNative_nativeInit<'l>(mut env: JNIEnv<'l>, _class: JClass<'l>, zip: JByteArray<'l>, dir: JString<'l>) -> jint {
              let zip = match env.convert_byte_array(&zip) {
                  Ok(zip) => zip,
                  Err(error) => {
                      set_error(format!("cannot read game data: {error}"));
                      return 1;
                  }
              };
              let dir: String = match env.get_string(&dir) {
                  Ok(dir) => dir.into(),
                  Err(error) => {
                      set_error(format!("cannot read files dir: {error}"));
                      return 1;
                  }
              };

              guarded(1, || match init(zip, Path::new(&dir)) {
                  Ok(()) => 0,
                  Err(error) => {
                      set_error(format!("{error:#}"));
                      1
                  }
              })
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_net_wie_app_WieNative_nativeTick<'l>(_env: JNIEnv<'l>, _class: JClass<'l>) {
              guarded((), || {
                  tick();
              })
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_net_wie_app_WieNative_nativeKey<'l>(_env: JNIEnv<'l>, _class: JClass<'l>, code: jint, down: jboolean) {
              key(code, down != 0);
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_net_wie_app_WieNative_nativeSetSurface<'l>(env: JNIEnv<'l>, _class: JClass<'l>, surface: JObject<'l>) {
              guarded((), || {
                  window::set_surface(&env, &surface);
                  REDRAW.store(true, Ordering::Relaxed);
              })
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_net_wie_app_WieNative_nativePollOut<'l>(mut env: JNIEnv<'l>, _class: JClass<'l>) -> jbyteArray {
              let message = poll_out();
              byte_array(&mut env, message)
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_net_wie_app_WieNative_nativeLastError<'l>(mut env: JNIEnv<'l>, _class: JClass<'l>) -> jbyteArray {
              let error = last_error();
              byte_array(&mut env, Some(error.into_bytes()))
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_net_wie_app_WieNative_nativeProfileText<'l>(mut env: JNIEnv<'l>, _class: JClass<'l>, _reset: jboolean) -> jbyteArray {
              byte_array(&mut env, Some(overlay::status_line().into_bytes()))
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_net_wie_app_WieNative_nativeWidth<'l>(_env: JNIEnv<'l>, _class: JClass<'l>) -> jint {
              WIDTH.load(Ordering::Relaxed) as jint
          }

          #[unsafe(no_mangle)]
          pub extern "system" fn Java_net_wie_app_WieNative_nativeHeight<'l>(_env: JNIEnv<'l>, _class: JClass<'l>) -> jint {
              HEIGHT.load(Ordering::Relaxed) as jint
          }

          // ---------------------------------------------------------------- logging

          mod logging {
              use std::{io, sync::Once};

              static INIT: Once = Once::new();

              #[cfg(target_os = "android")]
              mod sink {
                  use std::ffi::{CString, c_char, c_int};

                  #[link(name = "log")]
                  unsafe extern "C" {
                      fn __android_log_write(prio: c_int, tag: *const c_char, text: *const c_char) -> c_int;
                  }

                  pub fn write(line: &str) {
                      const ANDROID_LOG_INFO: c_int = 4;
                      let tag = c"wie";
                      if let Ok(text) = CString::new(line.replace('\0', " ")) {
                          unsafe { __android_log_write(ANDROID_LOG_INFO, tag.as_ptr(), text.as_ptr()) };
                      }
                  }
              }

              #[cfg(not(target_os = "android"))]
              mod sink {
                  pub fn write(line: &str) {
                      eprintln!("{line}");
                  }
              }

              struct LineWriter(Vec<u8>);

              impl io::Write for LineWriter {
                  fn write(&mut self, buf: &[u8]) -> io::Result<usize> {
                      self.0.extend_from_slice(buf);
                      Ok(buf.len())
                  }

                  fn flush(&mut self) -> io::Result<()> {
                      Ok(())
                  }
              }

              impl Drop for LineWriter {
                  fn drop(&mut self) {
                      let text = String::from_utf8_lossy(&self.0);
                      for line in text.lines().filter(|line| !line.is_empty()) {
                          crate::overlay::note_log_line(line);
                          sink::write(line);
                      }
                  }
              }

              pub fn init() {
                  INIT.call_once(|| {
                      let _ = tracing_subscriber::fmt()
                          .with_max_level(match std::env::var("WIE_LOG").as_deref() {
                              Ok("trace") => tracing::Level::TRACE,
                              Ok("debug") => tracing::Level::DEBUG,
                              _ => tracing::Level::INFO,
                          })
                          .with_ansi(false)
                          .without_time()
                          .with_target(false)
                          .with_writer(|| LineWriter(Vec::new()))
                          .try_init();
                  });
              }
          }
          WIE_EOF
          mkdir -p $(dirname wie_jni/src/overlay.rs)
          cat > wie_jni/src/overlay.rs <<'WIE_EOF'
          //! A diagnostic read-out stamped onto the frame before it reaches the surface.
          //!
          //! The Java shell's own profile overlay is dead code in the shipped build (nothing
          //! calls `startProfileOverlay`, and `profileView` is never created), and logcat needs
          //! a root-granted reader. Drawing straight into the frame needs neither, so the engine
          //! can report whether the ARM JIT actually took over and how fast the guest is running.
          //!
          //! Set `WIE_OVERLAY=0` to turn it off.

          use std::{
              sync::{
                  Mutex,
                  atomic::{AtomicU32, AtomicU64, Ordering},
              },
              time::{Duration, Instant},
          };

          /// What wie's own logs said about the ARM JIT, as captured by the logging sink.
          #[derive(Clone, Copy, PartialEq, Eq)]
          pub enum Jit {
              /// No AOT line seen yet — still preparing, or the backend was never built in.
              Unknown,
              Installed,
              Failed,
          }

          static JIT: Mutex<Jit> = Mutex::new(Jit::Unknown);
          static FRAMES: AtomicU64 = AtomicU64::new(0);
          static TICK_MICROS: AtomicU64 = AtomicU64::new(0);
          static TICK_COUNT: AtomicU64 = AtomicU64::new(0);
          static FPS_TIMES_10: AtomicU32 = AtomicU32::new(0);
          static TICK_MS_TIMES_10: AtomicU32 = AtomicU32::new(0);
          static WINDOW: Mutex<Option<Instant>> = Mutex::new(None);

          fn lock<T>(mutex: &'static Mutex<T>) -> std::sync::MutexGuard<'static, T> {
              mutex.lock().unwrap_or_else(|poison| poison.into_inner())
          }

          /// Called for every log line so the JIT verdict can be read off wie's own messages.
          pub fn note_log_line(line: &str) {
              if !line.contains("AOT") {
                  return;
              }
              let verdict = if line.contains("installed") {
                  Jit::Installed
              } else if line.contains("failed") {
                  Jit::Failed
              } else {
                  return;
              };
              *lock(&JIT) = verdict;
          }

          /// Records one completed `nativeTick`, and recomputes the rates once a second.
          pub fn note_tick(elapsed: Duration) {
              TICK_MICROS.fetch_add(elapsed.as_micros() as u64, Ordering::Relaxed);
              TICK_COUNT.fetch_add(1, Ordering::Relaxed);

              let mut window = lock(&WINDOW);
              let start = window.get_or_insert_with(Instant::now);
              let span = start.elapsed();
              if span < Duration::from_secs(1) {
                  return;
              }

              let frames = FRAMES.swap(0, Ordering::Relaxed);
              let ticks = TICK_COUNT.swap(0, Ordering::Relaxed);
              let micros = TICK_MICROS.swap(0, Ordering::Relaxed);
              FPS_TIMES_10.store((frames as f64 * 10.0 / span.as_secs_f64()) as u32, Ordering::Relaxed);
              TICK_MS_TIMES_10.store(if ticks == 0 { 0 } else { (micros / ticks / 100) as u32 }, Ordering::Relaxed);
              *window = Some(Instant::now());
          }

          pub fn note_frame() {
              FRAMES.fetch_add(1, Ordering::Relaxed);
          }

          fn enabled() -> bool {
              !matches!(std::env::var("WIE_OVERLAY").as_deref(), Ok("0"))
          }

          /// e.g. `JIT ON 58.2F 4.1MS`
          pub fn status_line() -> String {
              let jit = match *lock(&JIT) {
                  // No verdict: either the backend was never compiled in, or it is still preparing.
                  Jit::Unknown if cfg!(feature = "jit") => "JIT ?",
                  Jit::Unknown => "JIT NO",
                  Jit::Installed => "JIT ON",
                  Jit::Failed => "JIT OFF",
              };
              let fps = FPS_TIMES_10.load(Ordering::Relaxed);
              let tick = TICK_MS_TIMES_10.load(Ordering::Relaxed);
              format!("{jit} {}.{}F {}.{}MS", fps / 10, fps % 10, tick / 10, tick % 10)
          }

          // A 5x7 bitmap font, one byte per column, low bit at the top. Only the characters the
          // status line can produce are defined; anything else is drawn as a blank.
          fn glyph(character: char) -> [u8; 5] {
              match character {
                  '0' => [0x3e, 0x51, 0x49, 0x45, 0x3e],
                  '1' => [0x00, 0x42, 0x7f, 0x40, 0x00],
                  '2' => [0x42, 0x61, 0x51, 0x49, 0x46],
                  '3' => [0x21, 0x41, 0x45, 0x4b, 0x31],
                  '4' => [0x18, 0x14, 0x12, 0x7f, 0x10],
                  '5' => [0x27, 0x45, 0x45, 0x45, 0x39],
                  '6' => [0x3c, 0x4a, 0x49, 0x49, 0x30],
                  '7' => [0x01, 0x71, 0x09, 0x05, 0x03],
                  '8' => [0x36, 0x49, 0x49, 0x49, 0x36],
                  '9' => [0x06, 0x49, 0x49, 0x29, 0x1e],
                  'F' => [0x7f, 0x09, 0x09, 0x09, 0x01],
                  'I' => [0x00, 0x41, 0x7f, 0x41, 0x00],
                  'J' => [0x20, 0x40, 0x41, 0x3f, 0x01],
                  'M' => [0x7f, 0x02, 0x0c, 0x02, 0x7f],
                  'N' => [0x7f, 0x04, 0x08, 0x10, 0x7f],
                  'O' => [0x3e, 0x41, 0x41, 0x41, 0x3e],
                  'S' => [0x46, 0x49, 0x49, 0x49, 0x31],
                  'T' => [0x01, 0x01, 0x7f, 0x01, 0x01],
                  '.' => [0x00, 0x60, 0x60, 0x00, 0x00],
                  '?' => [0x02, 0x01, 0x51, 0x09, 0x06],
                  _ => [0; 5],
              }
          }

          /// Stamps `text` into an RGBA buffer at the top-left, over a black band.
          pub fn draw(rgba: &mut [u8], width: u32, height: u32, text: &str) {
              if !enabled() || width < 8 || height < 10 {
                  return;
              }
              let (width, height) = (width as usize, height as usize);
              let put = |rgba: &mut [u8], x: usize, y: usize, value: [u8; 3]| {
                  if x >= width || y >= height {
                      return;
                  }
                  let offset = (y * width + x) * 4;
                  if let Some(pixel) = rgba.get_mut(offset..offset + 3) {
                      pixel.copy_from_slice(&value);
                  }
              };

              for y in 0..9 {
                  for x in 0..width {
                      put(rgba, x, y, [0, 0, 0]);
                  }
              }
              for (index, character) in text.chars().enumerate() {
                  let origin = 1 + index * 6;
                  if origin + 5 >= width {
                      break;
                  }
                  for (column, bits) in glyph(character.to_ascii_uppercase()).into_iter().enumerate() {
                      for row in 0..7 {
                          if bits & (1 << row) != 0 {
                              put(rgba, origin + column, 1 + row, [0, 0xff, 0x40]);
                          }
                      }
                  }
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn reads_the_jit_verdict_off_wie_log_lines() {
                  note_log_line("Create thread: 1");
                  assert!(matches!(*lock(&JIT), Jit::Unknown));
                  note_log_line("ARM AOT preparation failed; using interpreter");
                  assert!(matches!(*lock(&JIT), Jit::Failed));
                  note_log_line("ARM AOT installed");
                  assert!(matches!(*lock(&JIT), Jit::Installed));
              }

              #[test]
              fn draws_only_inside_the_buffer() {
                  let (width, height) = (40u32, 12u32);
                  let mut rgba = vec![0xffu8; (width * height * 4) as usize];
                  draw(&mut rgba, width, height, "JIT ON 9.9F");
                  // The band is blacked out and at least one glyph pixel is lit.
                  assert_eq!(&rgba[0..3], &[0, 0, 0]);
                  assert!(rgba.chunks(4).any(|pixel| pixel[1] == 0xff && pixel[0] == 0));
                  // Rows below the band are untouched.
                  let below = (10 * width) as usize * 4;
                  assert_eq!(&rgba[below..below + 3], &[0xff, 0xff, 0xff]);
              }
          }
